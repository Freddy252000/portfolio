    <meta name="theme-color" content="#0f0f11" />

    <title>Freddy Vincent | Software Engineer & Mobile Developer</title>
    <meta
      name="description"
      content="Freddy Vincent is a React Native engineer and frontend developer with 3+ years building scalable mobile and web apps, real-time systems and clean frontend architecture."

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Apply the saved theme before paint to avoid a flash -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || (!t && matchMedia("(prefers-color-scheme: light)").matches)) {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
